<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>POOPOO RUN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- =========================================
     index.html — 🎨 A담당 (디자인/연출)
     시작/게임오버 화면 마크업, 조작법 안내.
     ⚠️ ID는 ui.js가 참조하므로 rename 금지:
        game hud scoreBox coinBox overlay ovMsg ovStats ovBest startBtn
     ========================================= -->
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="box" id="scoreBox">0 m</div>
    <div class="box" id="coinBox">🧻 0</div>
  </div>
  <div id="overlay">
    <div class="panel">
      <div class="logo">💩🚽💨</div>
      <h1>POOPOO RUN</h1>
      <div class="tagline">급똥 환자 100명의 추격전!</div>
      <p id="ovMsg">
        평화로운 공원 화장실의 변기 '푸푸'.<br>
        급똥 환자들에게 잡히기 전에 최대한 멀리 도망쳐라!
      </p>
      <div class="keys">
        <span class="key">← → 꾹 누르면 좌우 이동</span>
        <span class="key">↑ / Space 점프 (2단!)</span>
        <span class="key">↓ 슬라이드</span>
        <span class="key">📱 폰 기울여서 이동</span>
      </div>
      <div class="stats hidden" id="ovStats"></div>
      <div class="best" id="ovBest"></div>
      <button id="startBtn">▶ 도망치기 시작!</button>
      <div class="hint">시작하면 오프닝이 나옵니다 · 클릭 / 아무 키로 건너뛰기</div>
    </div>
  </div>
</div>

<!-- 로드 순서 중요! config → view → audio → render → engine → ui -->
<script src="config.js"></script>
<script src="view.js"></script>
<script src="audio.js"></script>
<script src="render.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
