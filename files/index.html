<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PooPoo — 변기 러너 레이싱</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <canvas id="world"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="chip" id="rankChip"><small>순위</small><span class="v" id="rankV">1</span><span id="rankTot">/8</span></div>
    <div class="chip" id="modeChip">일반 레이스</div>
    <div class="chip" id="coinChip"><small>코인</small>🪙 <span class="v" id="coinV">0</span></div>
    <div id="progWrap"><div id="progLabel">남은 거리</div>
      <div id="progTrack"><div id="progFill"></div><span id="flag">🏁</span></div></div>
    <div class="slot" id="itemSlot"><span id="itemEm">—</span><span class="lab">아이템 · SPACE</span></div>
    <div class="slot" id="boostBox"><span class="em">🚀</span><div id="boostBar"><i></i></div><span class="lab">부스터 · SHIFT</span></div>
    <div id="spd">0 <span>km/h</span></div>
  </div>
  <button class="tbtn" id="tItem">🎁</button>
  <button class="tbtn" id="tBoost">🚀</button>
  <div id="swipeHint">← 밀기 · 위로 점프 · 아래로 슬라이드 →</div>
  <div id="blind"><div class="txt">🧻!</div></div>

  <!-- MENU -->
  <div class="overlay" id="menu">
    <div class="logo">P<span class="d">💩</span>oPoo</div>
    <div class="slogan">세상에서 가장 빠른 변기가 되어 <b>하수구를 탈출하라!</b></div>
    <div class="panel">
      <div class="row-title">모드</div>
      <div class="seg" id="modeSeg">
        <button data-m="race" class="sel">일반 레이스<small>8인 경쟁</small></button>
        <button data-m="time">타임어택<small>기록 도전</small></button>
        <button data-m="survive">생존<small>꼴찌 탈락</small></button>
      </div>
      <div class="row-title" style="margin-top:14px;">난이도</div>
      <div class="seg diff" id="diffSeg">
        <button data-d="easy" class="easy">EASY</button>
        <button data-d="normal" class="normal sel">NORMAL</button>
        <button data-d="hard" class="hard">HARD</button>
      </div>
      <div class="row-title" style="margin-top:14px;">변기 스킨</div>
      <div class="skins" id="skinRow"></div>
      <div class="howto">
        <div><span class="k">← →</span>차선 (A/D · 스와이프)</div>
        <div><span class="k">↑</span>점프 (W · 위 스와이프)</div>
        <div><span class="k">↓</span>슬라이드 (S · 아래)</div>
        <div><span class="k">SPACE</span>아이템 사용</div>
        <div><span class="k">SHIFT</span>부스터 가속</div>
        <div><span class="k">🪙</span>코인 = 부스터 충전</div>
      </div>
    </div>
    <button class="bigbtn" id="startBtn">레이스 시작 ▶</button>
    <div class="foot">NON 2026 해커톤 · MVP 빌드</div>
  </div>

  <!-- countdown -->
  <div class="overlay hidden" id="countdown"><div class="cnum" id="cnum">3</div></div>

  <!-- results -->
  <div class="overlay hidden" id="results">
    <div class="place" id="placeTxt">1위!</div>
    <div class="panel">
      <div class="row-title" id="resTitle">최종 순위</div>
      <div class="stand" id="stand"></div>
      <div class="reward">
        <div><small>획득 코인</small>🪙 <span id="coinEarn">0</span></div>
        <div><small>MVP</small><span id="mvp">-</span></div>
      </div>
      <button class="bigbtn" id="againBtn" style="margin-top:14px;">다시 하기 🔁</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
